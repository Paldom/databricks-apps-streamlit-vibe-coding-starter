command: ["streamlit", "run", "app.py"]

env:
  # ===== Data Access =====
  # SQL Warehouse - for querying Delta tables
  # - name: SQL_WAREHOUSE_ID
  #   valueFrom: sql-warehouse        # Add SQL Warehouse resource with key: sql-warehouse

  # Unity Catalog - table and volume paths
  # - name: UNITY_CATALOG_TABLE
  #   value: "main.default.my_table"  # Update with your table FQN

  # - name: UNITY_CATALOG_VOLUME
  #   value: "main.default.my_volume"  # Update with your volume path

  # OLTP Database - connection string (store in secrets for production)
  # - name: OLTP_CONNECTION_STRING
  #   value: "postgresql://user:pass@host:5432/db"  # Or retrieve from secrets

  # Lakebase synced table — page reads from the Postgres-side replica.
  # PGHOST / PGDATABASE / PGPORT / PGSSLMODE / PGUSER are auto-injected by
  # Databricks Apps when the `lakebase-db` resource is bound to the app.
  - name: LAKEBASE_INSTANCE_NAME
    value: "streamlit-demo-lakebase"      # Must match databricks.yml var.lakebase_instance_name
  - name: SYNCED_SCHEMA
    value: "nyctaxi"
  - name: SYNCED_TABLE
    value: "trips_synced"

  # ===== AI/ML =====
  # Model Serving - for ML inference
  # - name: MODEL_SERVING_ENDPOINT
  #   valueFrom: model-endpoint      # Add Model Serving Endpoint resource with key: model-endpoint

  # Vector Search - for similarity search
  # - name: VECTOR_SEARCH_ENDPOINT
  #   valueFrom: vector-search-endpoint  # Add Vector Search Endpoint resource with key: vector-search-endpoint

  # Genie Space — two pages share this space.
  #   - 4_NYC_Taxi_Genie_iFrame.py uses GENIE_SPACE_URL (iframe embed).
  #   - 5_NYC_Taxi_Genie_native.py uses GENIE_SPACE_ID (Conversation API
  #     via Databricks SDK + native Streamlit chat UI).
  - name: GENIE_SPACE_ID
    value: "01f152305d531fc9b1c8e70b439bfa9e"

  # Iframe embed URL — workspace UI → Genie → <space> → Share → Embed iframe
  # to confirm the exact path. Pattern: <host>/embed/genie/rooms/<space-id>.
  - name: GENIE_SPACE_URL
    value: "https://adb-1272983411735654.14.azuredatabricks.net/embed/genie/rooms/01f152305d531fc9b1c8e70b439bfa9e"

  # Knowledge Assistant (Agent Bricks) — serving endpoint for the
  # Northwind PDFs page (6_Knowledge_Assistant.py).
  - name: KA_ENDPOINT_NAME
    value: "ka-fa945a0b-endpoint"

  # ===== Business Intelligence =====
  # Dashboard - embed URL for the NYC Taxi AI/BI dashboard
  # (Workspace → Dashboards → Share → Embed iframe).
  - name: DASHBOARD_EMBED_URL
    value: "https://adb-1272983411735654.14.azuredatabricks.net/embed/dashboardsv3/01f152dc97b912a6afa69f29d7e043de"

  # ===== Workflows =====
  # Job - for triggering workflows
  # - name: JOB_ID
  #   valueFrom: workflow-job        # Add Job resource with key: workflow-job

  # ===== Compute =====
  # Cluster - for data transformation at scale
  # - name: CLUSTER_ID
  #   valueFrom: compute-cluster     # Add Cluster resource with key: compute-cluster

  # ===== Governance =====
  # External Connection - for governed HTTP endpoints
  # - name: EXTERNAL_CONNECTION_NAME
  #   valueFrom: external-connection # Add External Connection resource with key: external-connection

  # Secrets - for secure credential storage
  # - name: SECRET_SCOPE
  #   value: "my-secret-scope"       # Update with your secret scope name
  # - name: SECRET_KEY
  #   value: "my-api-key"            # Update with your secret key name
